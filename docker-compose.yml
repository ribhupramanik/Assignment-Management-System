services:
  db:
    image: postgres:16-alpine
    container_name: joineazy-db

    environment:
      POSTGRES_DB: joineazy_db
      POSTGRES_USER: joineazy_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - joineazy_postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U joineazy_user -d joineazy_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: joineazy-backend

    depends_on:
      db:
        condition: service_healthy

    environment:
      PORT: 5000

      CLIENT_URL: http://localhost:5173

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: joineazy_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: joineazy_db

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 2h

      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    command: >
      sh -c "
      npm run seed:admin &&
      npm start
      "

    ports:
      - "5000:5000"


  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_URL: http://localhost:5000/api

    container_name: joineazy-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  joineazy_postgres_data: